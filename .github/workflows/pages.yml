# Publishes the folder website/ with GitHub Pages (docs/website.md, section "Publishing with GitHub Pages").
# One time in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
# After that every push to main that changes the site, the tools or the tests publishes the site again; "Run workflow" in the Actions tab does it by hand.
# The tests run first (tests.yml: the data files, the tools' rules and helpers, a smoke test of the page in a headless Chrome); if one fails, nothing is published.
name: Publish the website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tests/**'
      - 'shared/**'
      - 'exporter/**'
      - 'render_unit/**'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # what the page does not read stays out of the published site: the full unit data (15.7 MB per game version, the page reads the reduced file) and the local server
      - name: Leave out what the page does not need
        run: |
          rm -f website/assets/*/data/units-*.json
          rm -f website/serve.py website/serve.bat
          du -sh website
          find website -type f | wc -l

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
